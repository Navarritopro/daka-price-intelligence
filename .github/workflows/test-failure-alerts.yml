name: Probar alertas operativas

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe PROBAR para enviar una alerta de prueba"
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    if: ${{ inputs.confirm == 'PROBAR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt
      - name: Enviar alerta controlada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0, "scraper")
          from notifications import notify_failure

          result = notify_failure(
              "prueba operativa",
              RuntimeError("Esta es una prueba controlada; no existe una falla real"),
              "manual",
          )
          print(f"Canales probados: {result}")
          if not any(result.values()):
              raise SystemExit("No se envió ningún canal; revise Secrets y Variables de GitHub")
          PY
