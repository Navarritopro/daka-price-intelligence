name: Preparar Universo de Productos Daka

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe PREPARAR para crear las tablas del módulo"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirm == 'PREPARAR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.TEMP_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar conexión
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "Falta TEMP_DATABASE_URL o DATABASE_URL"; exit 1; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT current_database(), current_user;"
      - name: Crear estructura independiente
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/daka_product_universe.sql
      - name: Confirmar estructura
        shell: bash
        run: |
          set -euo pipefail
          for table in daka_import_batches daka_sku_master daka_sku_card_history daka_inventory_snapshots daka_locations daka_inventory_by_location daka_price_snapshots daka_price_items daka_universe_matches daka_universe_match_audit; do
            exists="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT to_regclass('public.' || '$table') IS NOT NULL")"
            test "$exists" = "t" || { echo "No se creó $table"; exit 1; }
          done
          echo "## Universo de Productos Daka preparado" >> "$GITHUB_STEP_SUMMARY"
          echo "Las tablas del universo, precios diarios y homologación fueron verificadas correctamente." >> "$GITHUB_STEP_SUMMARY"
