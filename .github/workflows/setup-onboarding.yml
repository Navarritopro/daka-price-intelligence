name: Preparar onboarding y centro de ayuda

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Crear estructura del onboarding
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/onboarding.sql
      - name: Confirmar estructura
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT onboarding_mode, COUNT(*) FROM app_users GROUP BY onboarding_mode ORDER BY onboarding_mode;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS progresos_registrados FROM app_onboarding_progress;"
