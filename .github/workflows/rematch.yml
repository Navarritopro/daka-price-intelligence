name: Recalcular homologaciones DAKA-Damasco

on:
  workflow_dispatch:
  schedule:
    # 10:30 a. m. Venezuela (UTC-4), después de las capturas de ambas tiendas.
    - cron: "30 14 * * *"

permissions:
  contents: read

concurrency:
  group: competitor-rematch
  cancel-in-progress: false

jobs:
  rematch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt
      - name: Recalcular candidatos y homologaciones
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scraper/rematch.py
