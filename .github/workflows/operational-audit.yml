name: Control operativo diario

on:
  workflow_dispatch:
  schedule:
    # 02:30 p. m. VET, después de los intentos principales y de respaldo.
    - cron: "30 18 * * *"

permissions:
  contents: read

concurrency:
  group: daily-operational-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MONITORED_SOURCES: ${{ vars.MONITORED_SOURCES || 'daka,damasco,multimax,ivoo,venelectronics' }}
      MAX_SUCCESS_AGE_HOURS: ${{ vars.MAX_SUCCESS_AGE_HOURS || '36' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt
      - name: Verificar capturas recientes
        run: python scraper/health_audit.py
