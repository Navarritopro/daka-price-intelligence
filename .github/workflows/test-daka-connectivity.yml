name: Probar conectividad DAKA

on:
  workflow_dispatch:
    inputs:
      pages:
        description: Páginas a comprobar sin guardar datos
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

concurrency:
  group: daka-connectivity-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnóstico sin escritura en Neon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DAKA_TEST_PAGES: ${{ inputs.pages }}
      DAKA_TEST_TIMEOUT_MS: "60000"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Instalar Chromium
        run: playwright install --with-deps chromium

      - name: Ejecutar diagnóstico de DAKA
        id: diagnostic
        continue-on-error: true
        run: python scraper/diagnose_daka.py

      - name: Guardar evidencia del diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daka-connectivity-diagnostic
          path: |
            daka-connectivity-report.json
            daka-connectivity-failure.png
          if-no-files-found: warn
          retention-days: 7

      - name: Confirmar resultado
        if: steps.diagnostic.outcome == 'failure'
        run: |
          echo "La prueba no pudo leer todas las páginas solicitadas de DAKA."
          exit 1
