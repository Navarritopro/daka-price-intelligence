name: Scraping diario Multimax

on:
  schedule:
    # 13:20 UTC = 09:20 AM VET, después de DAKA y Damasco.
    - cron: "20 13 * * *"
  workflow_dispatch:
    inputs:
      trigger_type:
        description: Origen de la ejecución
        required: false
        default: manual
        type: choice
        options:
          - manual
          - local

concurrency:
  group: multimax-price-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.trigger_type || 'manual' }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt
      - name: Ejecutar pruebas
        run: python -m unittest discover -s scraper/tests -p "test_*.py"
      - name: Extraer Multimax y actualizar homologación
        run: python scraper/multimax.py
